name: Send pick reminders

on:
  schedule:
    # Thursdays 15:23 UTC = 7:23am Pacific Standard Time (most of the NFL season); drifts to
    # 8:23am Pacific during the early-season daylight-time weeks, since GitHub Actions cron is
    # UTC-only. Deliberately off the top of the hour: GitHub queues scheduled runs and the :00
    # slot is the most congested -- a '0 16' schedule once started nearly 4 hours late.
    - cron: '23 15 * * 4'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (log what would be sent, without emailing anyone)'
        type: boolean
        default: true

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # The schedule trigger has no `inputs`, so this is false (a real send) for the weekly cron
      # and whatever the dry_run checkbox says for a manual run.
      - run: node scripts/send-pick-reminders.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
